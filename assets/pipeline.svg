<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="960" height="300" rx="18" fill="url(#bg)"/>
  <text x="32" y="44" fill="#e2e8f0" font-size="22" font-weight="700">Alcyone · W-JEPA</text>
  <text x="32" y="68" fill="#94a3b8" font-size="13">collision → land → hide a window → predict its watershed (targets computed exactly, never learned)</text>

  <!-- 1 event -->
  <g transform="translate(32,96)">
    <rect width="170" height="170" rx="12" fill="#0f172a" stroke="#334155"/>
    <text x="85" y="22" fill="#cbd5e1" font-size="13" text-anchor="middle" font-weight="600">1 · event</text>
    <circle cx="60" cy="80" r="7" fill="#f472b6"/><circle cx="118" cy="70" r="5" fill="#a78bfa"/>
    <circle cx="96" cy="120" r="10" fill="#fbbf24"/><circle cx="48" cy="136" r="6" fill="#fbbf24"/>
    <text x="85" y="160" fill="#64748b" font-size="11" text-anchor="middle">muons · electrons · jets</text>
  </g>
  <line x1="208" y1="181" x2="238" y2="181" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 2 land -->
  <g transform="translate(244,96)">
    <rect width="200" height="170" rx="12" fill="#0f172a" stroke="#334155"/>
    <text x="100" y="22" fill="#cbd5e1" font-size="13" text-anchor="middle" font-weight="600">2 · land on the (η, φ) cylinder</text>
    <path d="M14,128 C40,128 46,62 70,62 C94,62 96,112 112,112 C128,112 132,78 150,78 C168,78 172,128 186,128" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <path d="M14,140 C50,140 60,104 90,104 C120,104 130,140 186,140" fill="none" stroke="#a78bfa" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="100" y="158" fill="#64748b" font-size="11" text-anchor="middle">pT terrain + 8 Galactica-6.7B channels</text>
  </g>
  <line x1="450" y1="181" x2="480" y2="181" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 3 mask -->
  <g transform="translate(486,96)">
    <rect width="190" height="170" rx="12" fill="#0f172a" stroke="#334155"/>
    <text x="95" y="22" fill="#cbd5e1" font-size="13" text-anchor="middle" font-weight="600">3 · hide an 8×16 window</text>
    <rect x="20" y="40" width="150" height="96" rx="6" fill="#1e293b"/>
    <rect x="70" y="60" width="64" height="44" rx="4" fill="#0b1020" stroke="#f472b6" stroke-dasharray="4 3"/>
    <text x="102" y="87" fill="#f472b6" font-size="18" text-anchor="middle" font-weight="700">?</text>
    <text x="95" y="158" fill="#64748b" font-size="11" text-anchor="middle">encoder sees only the rest</text>
  </g>
  <line x1="682" y1="181" x2="712" y2="181" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 4 watershed -->
  <g transform="translate(718,96)">
    <rect width="210" height="170" rx="12" fill="#0f172a" stroke="#334155"/>
    <text x="105" y="22" fill="#cbd5e1" font-size="13" text-anchor="middle" font-weight="600">4 · predict the watershed</text>
    <path d="M16,60 L46,118 L76,80 L110,128 L146,72 L178,112 L196,60" fill="none" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M36,98 L46,118 L56,98 z" fill="url(#water)"/><path d="M96,108 L110,128 L124,108 z" fill="url(#water)"/>
    <path d="M166,100 L178,112 L188,100 z" fill="url(#water)"/>
    <text x="105" y="150" fill="#38bdf8" font-size="12" text-anchor="middle">basins · persistence · water</text>
    <text x="105" y="164" fill="#64748b" font-size="11" text-anchor="middle">union-find flood, elder rule</text>
  </g>
</svg>
